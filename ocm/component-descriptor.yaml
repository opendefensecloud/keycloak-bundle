name: strive.devops.t-systems.net/keycloak
version: 0.1.0-poc
provider:
  name: bwi

resources:
  # Keycloak image
  - name: keycloak-image
    type: ociImage
    version: 26.5.0
    relation: local
    access:
      type: ociArtifact
      imageReference: quay.io/keycloak/keycloak:26.5.0

  # PostgreSQL image
  - name: postgres-image
    type: ociImage
    version: "16"
    relation: local
    access:
      type: ociArtifact
      imageReference: ghcr.io/cloudnative-pg/postgresql:16

  # CloudNativePG operator image
  - name: cnpg-operator-image
    type: ociImage
    version: "1.22.0"
    relation: local
    access:
      type: ociArtifact
      imageReference: ghcr.io/cloudnative-pg/cloudnative-pg:1.22.0

  # Keycloak Client CRD
  - name: keycloakclient-crd
    type: kubernetes
    version: 0.1.0
    relation: local
    input:
      type: file
      path: ../charts/keycloak-client-operator/crds/keycloakclient-crd.yaml
      mediaType: application/yaml

  # Manifests
  - name: manifests
    type: directory
    version: 0.1.0
    relation: local
    input:
      type: file
      path: ../manifests.tar
      mediaType: application/x-tar

sources:
  - name: source
    type: git
    version: 0.1.0-poc
    access:
      type: git
      repoUrl: https://strive.devops.t-systems.net/bitbucket/scm/keycloak/keycloak.git
      ref: refs/heads/main
