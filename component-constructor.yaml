name: github.com/opendefensecloud/keycloak-ocm
version: 0.1.0-poc
provider:
  name: opendefensecloud
labels:
  - name: org.opencontainers.image.source
    value: https://github.com/opendefensecloud/keycloak-ocm
  - name: app.kubernetes.io/name
    value: keycloak-bundle
  - name: app.kubernetes.io/component
    value: identity-platform
  - name: app.kubernetes.io/part-of
    value: keycloak-ocm

resources:
  # Keycloak image
  - name: keycloak-image
    type: ociImage
    version: 26.5.3
    relation: local
    access:
      type: ociArtifact
      imageReference: quay.io/keycloak/keycloak:26.5.3

  # PostgreSQL image
  - name: postgres-image
    type: ociImage
    version: "18.1"
    relation: local
    access:
      type: ociArtifact
      imageReference: ghcr.io/cloudnative-pg/postgresql:18.1

  # CloudNativePG operator image
  - name: cnpg-operator-image
    type: ociImage
    version: "1.28.1"
    relation: local
    access:
      type: ociArtifact
      imageReference: ghcr.io/cloudnative-pg/cloudnative-pg:1.28.1

  # Keycloak Client CRD
  - name: keycloakclient-crd
    type: kubernetes
    version: 0.1.0
    relation: local
    input:
      type: file
      path: charts/keycloak-client-operator/crds/keycloakclient-crd.yaml
      mediaType: application/yaml

  # Manifests
  - name: manifests
    type: directory
    version: 0.1.0
    relation: local
    input:
      type: file
      path: manifests.tar
      mediaType: application/x-tar

sources:
  - name: source
    type: git
    version: 0.1.0-poc
    access:
      type: git
      repoUrl: https://github.com/opendefensecloud/keycloak-ocm.git
      ref: refs/heads/main
