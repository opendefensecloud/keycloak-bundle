apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keycloak-client-operator.fullname" . }}
  labels:
    {{- include "keycloak-client-operator.labels" . | nindent 4 }}
rules:
  # KeycloakClient CRD
  - apiGroups: ["keycloak.bwi.de"]
    resources: ["keycloakclients"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["keycloak.bwi.de"]
    resources: ["keycloakclients/status"]
    verbs: ["get", "update", "patch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Secrets (for Keycloak API credentials)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "keycloak-client-operator.fullname" . }}
  labels:
    {{- include "keycloak-client-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "keycloak-client-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "keycloak-client-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
