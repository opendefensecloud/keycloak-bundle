apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak-client-operator.fullname" . }}
  labels:
    {{- include "keycloak-client-operator.labels" . | nindent 4 }}
    app: keycloak-client-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "keycloak-client-operator.selectorLabels" . | nindent 6 }}
      app: keycloak-client-operator
  template:
    metadata:
      labels:
        {{- include "keycloak-client-operator.selectorLabels" . | nindent 8 }}
        app: keycloak-client-operator
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-operator.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keycloak-client-operator.serviceAccountName" . }}
      securityContext:
        runAsUser: 0
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Installing runtime dependencies..."
              apk add --no-cache curl jq bash
              
              echo "Installing kubectl..."
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x kubectl
              mv kubectl /usr/local/bin/
              
              echo "Starting operator script..."
              /scripts/operator.sh
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-creds
                  key: username
                  optional: true
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-creds
                  key: password
                  optional: true
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: script-volume
              mountPath: /scripts
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: script-volume
          configMap:
            name: {{ include "keycloak-client-operator.fullname" . }}-script
            defaultMode: 0755
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
