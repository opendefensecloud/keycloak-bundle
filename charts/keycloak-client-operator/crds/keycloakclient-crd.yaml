apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keycloakclients.keycloak.ocm.software
spec:
  group: keycloak.ocm.software
  names:
    kind: KeycloakClient
    listKind: KeycloakClientList
    plural: keycloakclients
    singular: keycloakclient
    shortNames:
      - kcc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - clientId
              properties:
                clientId:
                  type: string
                  description: "Client ID in Keycloak"
                  minLength: 1
                name:
                  type: string
                  description: "Display name"
                description:
                  type: string
                  description: "Client description"
                enabled:
                  type: boolean
                  default: true
                protocol:
                  type: string
                  enum: ["openid-connect", "saml"]
                  default: "openid-connect"
                publicClient:
                  type: boolean
                  default: false
                  description: "If true, no client secret required"
                redirectUris:
                  type: array
                  items:
                    type: string
                  description: "Valid redirect URIs"
                webOrigins:
                  type: array
                  items:
                    type: string
                  description: "Allowed CORS origins"
                # TODO: Add more fields as needed
                #   - serviceAccountsEnabled
                #   - authorizationServicesEnabled
                #   - standardFlowEnabled
                #   - directAccessGrantsEnabled
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  default: false
                keycloakId:
                  type: string
                  description: "Internal Keycloak client UUID"
                lastSyncTime:
                  type: string
                  format: date-time
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ClientID
          type: string
          jsonPath: .spec.clientId
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
