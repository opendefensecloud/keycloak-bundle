apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keycloakusers.keycloak.ocm.software
spec:
  group: keycloak.ocm.software
  names:
    kind: KeycloakUser
    listKind: KeycloakUserList
    plural: keycloakusers
    singular: keycloakuser
    shortNames:
      - kcu
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - realmRef
                - username
              properties:
                realmRef:
                  type: string
                  description: "Name of the Keycloak realm this user belongs to."
                  minLength: 1
                username:
                  type: string
                  description: "Unique username within the realm."
                  minLength: 1
                email:
                  type: string
                  description: "User email address."
                firstName:
                  type: string
                  description: "User first name."
                lastName:
                  type: string
                  description: "User last name."
                enabled:
                  type: boolean
                  default: true
                  description: "Whether the user account is active."
                emailVerified:
                  type: boolean
                  default: false
                  description: "Whether the email address has been verified."
                groups:
                  type: array
                  items:
                    type: string
                  description: "List of group names to assign this user to."
                initialPassword:
                  type: object
                  description: "Reference to a Kubernetes Secret holding the initial password. Written only on user creation."
                  required:
                    - secretName
                  properties:
                    secretName:
                      type: string
                      description: "Name of the Secret in the same namespace."
                    secretKey:
                      type: string
                      description: "Key within the Secret. Defaults to 'password'."
                      default: "password"
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  default: false
                keycloakId:
                  type: string
                  description: "Internal Keycloak user UUID."
                lastSyncTime:
                  type: string
                  format: date-time
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Realm
          type: string
          jsonPath: .spec.realmRef
        - name: Username
          type: string
          jsonPath: .spec.username
        - name: Email
          type: string
          jsonPath: .spec.email
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
