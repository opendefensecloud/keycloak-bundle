apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keycloakclientscopes.keycloak.ocm.software
spec:
  group: keycloak.ocm.software
  names:
    kind: KeycloakClientScope
    listKind: KeycloakClientScopeList
    plural: keycloakclientscopes
    singular: keycloakclientscope
    shortNames:
      - kccs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - realmRef
                - name
              properties:
                realmRef:
                  type: string
                  description: "Name of the Keycloak realm this scope belongs to."
                  minLength: 1
                name:
                  type: string
                  description: "Client scope name within the realm."
                  minLength: 1
                protocol:
                  type: string
                  enum: ["openid-connect", "saml"]
                  default: "openid-connect"
                  description: "Protocol this scope applies to."
                description:
                  type: string
                  description: "Human-readable description."
                attributes:
                  type: object
                  description: "Free-form key/value attributes (e.g. include.in.token.scope)."
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  default: false
                keycloakId:
                  type: string
                  description: "Internal Keycloak client scope UUID."
                lastSyncTime:
                  type: string
                  format: date-time
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Realm
          type: string
          jsonPath: .spec.realmRef
        - name: ScopeName
          type: string
          jsonPath: .spec.name
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
