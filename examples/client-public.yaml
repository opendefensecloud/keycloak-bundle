apiVersion: keycloak.ocm.software/v1alpha1
kind: KeycloakClient
metadata:
  name: spa-frontend
spec:
  clientId: spa-frontend
  name: SPA Frontend
  description: Public client for single-page application
  enabled: true
  protocol: openid-connect
  publicClient: true
  redirectUris:
    - "http://localhost:4200/*"
  webOrigins:
    - "http://localhost:4200"
