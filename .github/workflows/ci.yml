# ==============================================================================
# ci.yml - Keycloak OCM CI/CD Pipeline
# ==============================================================================
#
# Pipeline Flow:
#   1. Quality Checks
#      - YAML Lint (manifests/, kro/, ocm/, charts/, examples/)
#      - ShellCheck (scripts/**/*.sh)
#      - Gitleaks (Secrets Detection)
#
#   2. Build OCM
#      - Create component archive (scripts/ocm/ocm-create.sh)
#      - Sign & Validate archive (scripts/ocm/ocm-sign.sh, scripts/ocm/ocm-validate.sh)
#
#   3. Transfer (if enabled)
#      - Push component to OCI registry (scripts/ocm/ocm-transfer.sh)
#
#   4. Deploy & Verify (if enabled)
#      - Deploy Keycloak to K8s (scripts/deploy/deploy-all.sh)
#      - Verify Pod Readiness & HTTP Health Check
#      - Smoke Test (scripts/utils/status.sh)
#      - Capability Verify (scripts/tests/test-crd.sh)
#      - Cleanup Test Instance (scripts/deploy/cleanup.sh)
#
# All deployment logic lives in scripts/ - this workflow orchestrates the process.
# ==============================================================================

name: OCM Build & Deploy

on:
  push:
    branches: [main, 'delivery/**', 'feature/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_lint:
        description: 'Run Lint & Security Scan'
        type: boolean
        default: true
      run_build:
        description: 'Run Build & Validate'
        type: boolean
        default: true
      run_transfer:
        description: 'Run Transfer to Registry'
        type: boolean
        default: true
      run_deploy:
        description: 'Run Deploy & Smoke Test'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  INSTANCE_NAME: "ci"

jobs:
  # ── 1. Quality Checks ───────────────────────────────────────────────
  lint:
    name: "1. Quality Checks"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_lint }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Scan full history for Gitleaks

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: |
            manifests/
            kro/
            component-constructor.yaml
            charts/keycloak-client-operator/Chart.yaml
            charts/keycloak-client-operator/values.yaml
            charts/keycloak-client-operator/crds/
            examples/
          config_data: |
            extends: default
            rules:
              line-length:
                max: 150
              truthy:
                check-keys: false
              document-start: disable
              comments-indentation: disable

      - name: ShellCheck
        run: |
          sudo apt-get -qq install -y shellcheck > /dev/null 2>&1
          shopt -s globstar
          echo "Scanning the following scripts:"
          ls -1 scripts/**/*.sh
          shellcheck -S warning scripts/**/*.sh

      - name: Gitleaks (Secrets Scan)
        run: |
          GITLEAKS_VERSION="8.30.0"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact -v

  # ── 2. Build OCM Package ────────────────────────────────────────────
  build:
    name: "2. Build OCM"
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ (always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')) && (github.event_name != 'workflow_dispatch' || inputs.run_build) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup OCM CLI
        uses: open-component-model/ocm-setup-action@8c71929f38d3486e352e5d7aaf813f36accaaf43
        with:
          version: latest

      - name: Build OCM Component Archive
        run: |
          chmod +x scripts/**/*.sh
          ./scripts/ocm/ocm-create.sh

      - name: Sign OCM Component
        run: ./scripts/ocm/ocm-sign.sh

      - name: Validate OCM Component
        run: ./scripts/ocm/ocm-validate.sh

      - name: Prepare Artifacts
        run: |
          cp ocm-output/keycloak-ocm-ctf.tar.gz .

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ocm-component-archive
          path: |
            keycloak-ocm-ctf.tar.gz
            ocm-key.pub
          retention-days: 30
          if-no-files-found: error

      - name: Add Job Summary
        run: |
          echo "### 📦 OCM Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Component** | \`keycloak-ocm\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`keycloak-ocm-ctf.tar.gz\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signature** | \`keycloak-ocm-sig\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Verification Passed** - Artifact is ready for transfer." >> $GITHUB_STEP_SUMMARY

  # ── 3. Transfer to Registry (any branch) ─────────────────────────────
  transfer:
    name: "3. Transfer to Registry"
    runs-on: ubuntu-latest
    needs: build
    environment: cicd
    # Build must succeed for Transfer to have an artifact to download
    if: ${{ needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_transfer) }}
    steps:
      - uses: actions/checkout@v6

      - name: Download Signed Artifact
        uses: actions/download-artifact@v8
        with:
          name: ocm-component-archive
          path: ocm-output

      - name: Setup OCM CLI
        uses: open-component-model/ocm-setup-action@8c71929f38d3486e352e5d7aaf813f36accaaf43
        with:
          version: latest

      - name: Transfer Signed Component
        env:
          OCM_USER: ${{ secrets.OCM_REGISTRY_USER || github.actor }}
          OCM_PASSWORD: ${{ secrets.OCM_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
          # Registry must be provided via Vars or Secrets
          OCM_REGISTRY: ${{ vars.OCM_REGISTRY || secrets.OCM_REGISTRY }}
        run: |
          chmod +x scripts/**/*.sh
          ./scripts/ocm/ocm-transfer.sh ocm-output/keycloak-ocm-ctf.tar.gz --user "$OCM_USER" --password "$OCM_PASSWORD"

      - name: Add Job Summary
        if: success()
        env:
          OCM_REGISTRY: ${{ vars.OCM_REGISTRY || secrets.OCM_REGISTRY }}
        run: |
          echo "| **Transfer** | ✅ Success | Target: \`${{ env.OCM_REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY

  # ── 4. Deploy + Smoke Test + Cleanup (any branch) ───────────────────
  deploy:
    name: "4. Deploy & Verify"
    runs-on: ubuntu-latest
    needs: transfer
    environment: cicd
    # Deploy can run if Transfer succeeded OR was skipped (deploy doesn't need the transferred artifact)
    if: ${{ (always() && (needs.transfer.result == 'success' || needs.transfer.result == 'skipped')) && (github.event_name != 'workflow_dispatch' || inputs.run_deploy) }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Keycloak Instance
        run: |
          chmod +x scripts/**/*.sh
          ./scripts/deploy/deploy-all.sh ${{ env.INSTANCE_NAME }} --clean

      - name: Verify Deployment
        run: |
          NAMESPACE="keycloak-${{ env.INSTANCE_NAME }}"
          echo "=== Waiting for PostgreSQL Pod Creation ==="
          timeout 300s bash -c "until kubectl get pod -n $NAMESPACE -l cnpg.io/cluster=keycloak-db,cnpg.io/instanceRole=primary 2>/dev/null | grep -q 'Running\|Pending'; do echo 'Waiting for primary pod...'; sleep 5; done"

          echo "=== Waiting for PostgreSQL Readiness ==="
          kubectl wait pod -n "$NAMESPACE" \
            -l cnpg.io/cluster=keycloak-db,cnpg.io/instanceRole=primary \
            --for=condition=Ready --timeout=600s

          echo "=== Waiting for Keycloak ==="
          kubectl wait --for=condition=available deployment/keycloak \
            -n "$NAMESPACE" --timeout=600s

          echo "=== Pod Status ==="
          kubectl get pods -n "$NAMESPACE" -o wide

      - name: Smoke Test
        run: |
          NAMESPACE="keycloak-${{ env.INSTANCE_NAME }}"
          echo "=== Running dev-status.sh for Smoke Test ==="
          ./scripts/utils/status.sh ${{ env.INSTANCE_NAME }}

          echo "=== Keycloak HTTP Health Check ==="
          kubectl port-forward -n "$NAMESPACE" deploy/keycloak 9000:9000 &
          PF_PID=$!
          sleep 5
          if curl -sf http://localhost:9000/health/ready; then
            echo ""
            echo "Health check passed ✅"
          else
            echo "Health check failed ❌"
            exit 1
          fi
          kill $PF_PID || true

      - name: Verify CRD Capabilities
        run: |
          NAMESPACE="keycloak-${{ env.INSTANCE_NAME }}"
          echo "=== Testing KeycloakClient CRD ==="
          ./scripts/tests/test-crd.sh "$NAMESPACE"

      - name: Cleanup Test Instance
        if: always()
        run: |
          echo "Cleanup disabled for manual inspection."
          # ./scripts/deploy/cleanup.sh ${{ env.INSTANCE_NAME }} || true

      - name: Add Job Summary
        if: success()
        run: |
          echo "| **Deploy** | ✅ Success | Namespace: \`keycloak-${{ env.INSTANCE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
