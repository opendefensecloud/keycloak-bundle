apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: keycloakinstance
spec:
  # Schema for KeycloakInstance CRD (generated by KRO)
  schema:
    apiVersion: v1alpha1
    kind: KeycloakInstance
    spec:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "Instance name, used for namespace"
        replicas:
          type: integer
          default: 1
          minimum: 1
        dbInstances:
          type: integer
          default: 1
          minimum: 1
          description: "PostgreSQL instances (1 for dev, 3 for HA)"
        dbStorageSize:
          type: string
          default: "5Gi"
        hostname:
          type: string
          default: ""
          description: "External hostname (optional, for production)"
        adminUser:
          type: string
          default: "admin"
          description: "Initial admin username"
        adminPassword:
          type: string
          default: "admin"
          description: "Initial admin password (CHANGE ON FIRST LOGIN)"
    status:
      type: object
      properties:
        ready:
          type: boolean
        namespace:
          type: string
        keycloakUrl:
          type: string

  resources:
    # 1. Namespace
    - id: namespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: "keycloak-{{ .metadata.name }}"
          labels:
            app.kubernetes.io/name: keycloak
            app.kubernetes.io/instance: "{{ .metadata.name }}"
            app.kubernetes.io/managed-by: kro

    # 2. CloudNativePG Cluster
    - id: postgres-cluster
      template:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: keycloak-db
          namespace: "keycloak-{{ .metadata.name }}"
        spec:
          instances: "{{ .spec.dbInstances }}"
          storage:
            size: "{{ .spec.dbStorageSize }}"
          bootstrap:
            initdb:
              database: keycloak
              owner: keycloak
          postgresql:
            parameters:
              max_connections: "100"
              shared_buffers: "128MB"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      dependsOn:
        - namespace

    # 3. Keycloak Admin Secret
    - id: keycloak-admin-secret
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: keycloak-admin
          namespace: "keycloak-{{ .metadata.name }}"
        type: Opaque
        stringData:
          KEYCLOAK_ADMIN: "{{ .spec.adminUser }}"
          KEYCLOAK_ADMIN_PASSWORD: "{{ .spec.adminPassword }}"
      dependsOn:
        - namespace

    # 4. Keycloak Deployment (Official Keycloak from Quay.io)
    - id: keycloak-deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: keycloak
          namespace: "keycloak-{{ .metadata.name }}"
          labels:
            app: keycloak
        spec:
          replicas: "{{ .spec.replicas }}"
          selector:
            matchLabels:
              app: keycloak
          template:
            metadata:
              labels:
                app: keycloak
            spec:
              containers:
                - name: keycloak
                  image: quay.io/keycloak/keycloak:26.5.0
                  args:
                    - start
                  ports:
                    - containerPort: 8080
                      name: http
                    - containerPort: 8443
                      name: https
                  env:
                    # Official Keycloak environment variables (KC_ prefix)
                    # Database configuration
                    - name: KC_DB
                      value: postgres
                    - name: KC_DB_URL_HOST
                      value: keycloak-db-rw
                    - name: KC_DB_URL_PORT
                      value: "5432"
                    - name: KC_DB_URL_DATABASE
                      value: keycloak
                    - name: KC_DB_USERNAME
                      valueFrom:
                        secretKeyRef:
                          name: keycloak-db-app
                          key: username
                    - name: KC_DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: keycloak-db-app
                          key: password
                    # HTTP configuration
                    - name: KC_HTTP_ENABLED
                      value: "true"
                    - name: KC_HTTP_PORT
                      value: "8080"
                    - name: KC_HOSTNAME_STRICT
                      value: "false"
                    - name: KC_HOSTNAME_STRICT_HTTPS
                      value: "false"
                    # Health and metrics
                    - name: KC_HEALTH_ENABLED
                      value: "true"
                    - name: KC_METRICS_ENABLED
                      value: "true"
                    # Proxy configuration
                    - name: KC_PROXY
                      value: edge
                    # Admin credentials
                    - name: KEYCLOAK_ADMIN
                      valueFrom:
                        secretKeyRef:
                          name: keycloak-admin
                          key: KEYCLOAK_ADMIN
                    - name: KEYCLOAK_ADMIN_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: keycloak-admin
                          key: KEYCLOAK_ADMIN_PASSWORD
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "1Gi"
                      cpu: "1000m"
                  livenessProbe:
                    httpGet:
                      path: /health/live
                      port: 8080
                    initialDelaySeconds: 120
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health/ready
                      port: 8080
                    initialDelaySeconds: 60
                    periodSeconds: 5
      dependsOn:
        - keycloak-admin-secret
        - postgres-cluster

    # 5. Keycloak Service
    - id: keycloak-service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: keycloak
          namespace: "keycloak-{{ .metadata.name }}"
        spec:
          type: ClusterIP
          ports:
            - port: 8080
              targetPort: 8080
              name: http
            - port: 8443
              targetPort: 8443
              name: https
          selector:
            app: keycloak
      dependsOn:
        - keycloak-deployment

  # Status aggregation
  status:
    ready:
      allOf:
        - ".status.keycloak-deployment.status.readyReplicas >= 1"
    namespace: "keycloak-{{ .metadata.name }}"
    keycloakUrl: "http://keycloak.keycloak-{{ .metadata.name }}.svc:8080"
